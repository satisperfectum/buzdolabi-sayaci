<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070807" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ROAR Training Studio</title>
  
  <style>
:root{
  --bg:#070807; --panel:#111312; --panel2:#171918; --panel3:#202321; --line:#2b302b;
  --text:#f5f7f5; --muted:#959c96; --green:#8cff00; --green2:#67d800; --greenSoft:#1b2b10;
  --danger:#ff5b62; --warning:#ffb020; --success:#8cff00; --shadow:0 18px 55px rgba(0,0,0,.28);
  --radius:20px; --radiusSm:14px; --nav:76px; --fontScale:1;
}
[data-theme="light"]{
  --bg:#f3f5f2; --panel:#ffffff; --panel2:#f7f9f6; --panel3:#edf1eb; --line:#dce3d8;
  --text:#101310; --muted:#667066; --green:#68d900; --green2:#56bd00; --greenSoft:#eaf8de;
  --shadow:0 18px 50px rgba(44,61,38,.10);
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--fontScale));background:var(--bg)}
body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.eyebrow{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:800}
.app{min-height:100vh;display:grid;grid-template-columns:1fr}
.sidebar{display:none}
.main{width:100%;max-width:1460px;margin:0 auto;padding:18px 18px calc(var(--nav) + 28px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;position:sticky;top:0;z-index:25;padding:10px 0;background:linear-gradient(var(--bg) 65%,transparent)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logoMark{width:46px;height:46px;display:grid;place-items:center;color:var(--green)}
.logoMark svg{width:42px;height:42px;filter:drop-shadow(0 0 7px color-mix(in srgb,var(--green) 45%,transparent))}
.logoWord{font-size:1.45rem;line-height:1;font-weight:950;letter-spacing:.08em;color:var(--green)}
.logoSub{font-size:.68rem;letter-spacing:.24em;color:var(--muted);margin-top:5px}
.topActions{display:flex;align-items:center;gap:8px}
.iconBtn,.pillBtn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;transition:.18s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.iconBtn{width:44px;height:44px;padding:0;position:relative}.iconBtn:hover,.pillBtn:hover,.btn:hover{border-color:color-mix(in srgb,var(--green) 55%,var(--line));transform:translateY(-1px)}
.pillBtn{min-height:42px;padding:0 13px}.pillBtn .roleLabel{display:none}
.btn{min-height:46px;padding:0 16px;font-weight:760}.btn.primary{background:var(--green);color:#0a0b09;border-color:var(--green)}.btn.ghost{background:transparent}.btn.danger{border-color:color-mix(in srgb,var(--danger) 35%,var(--line));color:var(--danger)}.btn.small{min-height:36px;padding:0 12px;font-size:.88rem}.btn.full{width:100%}
.badgeDot{position:absolute;width:9px;height:9px;border-radius:999px;background:var(--green);right:8px;top:7px;box-shadow:0 0 0 3px var(--bg)}
.pageHead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:4px 2px 18px}.pageHead h1{margin:4px 0 4px;font-size:clamp(1.55rem,4vw,2.25rem);letter-spacing:-.035em}.pageHead p{margin:0;color:var(--muted);font-size:.94rem}
.grid{display:grid;gap:14px}.grid.two{grid-template-columns:1fr}.grid.three{grid-template-columns:1fr}.grid.four{grid-template-columns:repeat(2,1fr)}
.card{background:linear-gradient(145deg,var(--panel),color-mix(in srgb,var(--panel2) 80%,var(--bg)));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-width:0}
.card.flat{box-shadow:none}.card.highlight{border-color:color-mix(in srgb,var(--green) 40%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--green) 10%,transparent),var(--shadow)}
.cardTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.cardTitle h2,.cardTitle h3{margin:0;font-size:1.03rem}.cardTitle .link{color:var(--green);font-size:.85rem;font-weight:750}
.metric{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:18px;min-height:118px}.metricLabel{font-size:.78rem;color:var(--muted);display:flex;gap:8px;align-items:center}.metricValue{font-size:1.75rem;font-weight:900;letter-spacing:-.05em;margin-top:12px}.metricMeta{font-size:.77rem;color:var(--muted);margin-top:6px}.positive{color:var(--green)}
.hero{position:relative;overflow:hidden;min-height:250px;background:#0b0c0b;border:1px solid var(--line);border-radius:26px;margin-bottom:16px;box-shadow:var(--shadow)}

.hero::after{content:"";position:absolute;width:300px;height:300px;border-radius:999px;background:var(--green);filter:blur(120px);opacity:.13;right:-100px;bottom:-150px}.heroContent{position:relative;z-index:1;padding:26px;max-width:680px}.hero h2{font-size:clamp(2rem,7vw,4rem);margin:12px 0 8px;line-height:.98;letter-spacing:-.055em}.hero h2 span{color:var(--green)}.hero p{color:#c8cec8;max-width:530px;line-height:1.55}.heroActions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.nextLesson{display:flex;align-items:center;justify-content:space-between;gap:14px}.lessonMain{display:flex;gap:13px;align-items:center;min-width:0}.avatar{width:50px;height:50px;border-radius:16px;background:linear-gradient(145deg,#2c312c,#101210);border:1px solid color-mix(in srgb,var(--green) 22%,var(--line));display:grid;place-items:center;font-weight:900;color:var(--green);flex:none}.avatar.round{border-radius:999px}.lessonName{font-weight:850}.lessonMeta{font-size:.83rem;color:var(--muted);margin-top:4px}.status{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:.75rem;font-weight:780;background:var(--panel3);color:var(--muted);white-space:nowrap}.status.success{background:var(--greenSoft);color:var(--green)}.status.warn{background:color-mix(in srgb,var(--warning) 12%,var(--panel));color:var(--warning)}.status.danger{background:color-mix(in srgb,var(--danger) 12%,var(--panel));color:var(--danger)}
.list{display:flex;flex-direction:column}.listRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}.listRow:first-child{border-top:0}.listRowMain{min-width:0}.listRowTitle{font-weight:760}.listRowSub{font-size:.8rem;color:var(--muted);margin-top:4px}.rowActions{display:flex;gap:7px;flex:none}
.quickGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;color:var(--text);text-align:left}.quickIcon{width:38px;height:38px;border-radius:13px;background:var(--greenSoft);color:var(--green);display:grid;place-items:center;margin-bottom:15px}.quick b{display:block;font-size:.92rem}.quick span{font-size:.76rem;color:var(--muted);display:block;margin-top:4px}
.progress{height:8px;border-radius:999px;background:var(--panel3);overflow:hidden}.progress>i{height:100%;display:block;background:var(--green);border-radius:999px}.packageRow{padding:15px;border-radius:17px;border:1px solid var(--line);background:var(--panel);margin-top:10px}.packageTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.packageTop b{display:block}.packageMeta{font-size:.78rem;color:var(--muted);margin-top:5px}.packageBottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;font-size:.78rem;color:var(--muted)}
.qrCard{display:grid;grid-template-columns:1fr;gap:18px;align-items:center}.qrVisual{width:190px;aspect-ratio:1;margin:auto;background:#fff;border-radius:20px;padding:14px;box-shadow:0 0 0 1px var(--line),0 0 30px color-mix(in srgb,var(--green) 15%,transparent)}.qrVisual svg{width:100%;height:100%;display:block}.qrText h2{font-size:1.6rem;margin:0 0 8px}.qrText p{color:var(--muted);line-height:1.5;margin:0}.qrTimer{display:inline-flex;margin-top:12px;padding:7px 10px;border-radius:999px;background:var(--greenSoft);color:var(--green);font-size:.78rem;font-weight:800}
.tabs{display:flex;gap:6px;overflow:auto;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;scrollbar-width:none}.tab{border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:10px;white-space:nowrap;font-weight:700}.tab.active{background:var(--green);color:#0a0b09}
.searchbar{display:flex;gap:8px;margin-bottom:12px}.searchbar input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;min-height:44px;padding:0 13px;outline:none}.field textarea{min-height:110px;padding-top:12px;resize:vertical}.searchbar input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 12%,transparent)}.filters{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.filter{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 11px;border-radius:999px;white-space:nowrap}.filter.active{border-color:var(--green);color:var(--green);background:var(--greenSoft)}
.calendarWeek{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:8px;overflow:auto;padding-bottom:4px}.dayCol{min-width:100px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px}.dayHead{font-size:.75rem;color:var(--muted);margin-bottom:9px}.event{padding:9px;border-radius:11px;background:var(--panel3);margin-top:7px;font-size:.72rem;border-left:3px solid var(--green)}.event time{color:var(--green);font-weight:800;display:block;margin-bottom:4px}
.chart{height:160px;display:flex;align-items:flex-end;gap:7px;padding-top:22px}.bar{flex:1;min-width:8px;background:linear-gradient(var(--green),var(--green2));border-radius:7px 7px 2px 2px;opacity:.9;position:relative}.bar::after{content:attr(data-label);position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:.62rem;color:var(--muted)}
.lineChart{height:180px;position:relative;border-bottom:1px solid var(--line);border-left:1px solid var(--line);overflow:hidden}.lineChart svg{width:100%;height:100%}.lineChart .gridLine{stroke:var(--line);stroke-width:1}.lineChart .trend{fill:none;stroke:var(--green);stroke-width:3}.lineChart .dot{fill:var(--bg);stroke:var(--green);stroke-width:3}
.notice{padding:13px 14px;border-radius:15px;background:var(--greenSoft);border:1px solid color-mix(in srgb,var(--green) 18%,var(--line));color:var(--text);display:flex;gap:10px;align-items:flex-start}.notice b{color:var(--green)}
.settingsGrid{display:grid;grid-template-columns:1fr;gap:12px}.settingRow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid var(--line)}.settingRow:first-child{border-top:0}.switch{width:48px;height:28px;border-radius:999px;background:var(--panel3);border:1px solid var(--line);position:relative;flex:none}.switch::after{content:"";position:absolute;width:20px;height:20px;top:3px;left:4px;border-radius:50%;background:var(--muted);transition:.2s}.switch.on{background:var(--greenSoft);border-color:color-mix(in srgb,var(--green) 50%,var(--line))}.switch.on::after{left:22px;background:var(--green)}

  <script type="module">
const HOUR = 60 * 60 * 1000;
const YEAR = 365 * 24 * HOUR;

function hoursUntil(start, now = new Date()) {
  return (new Date(start).getTime() - new Date(now).getTime()) / HOUR;
}

function canCancelWithoutCharge(lessonStart, noticeAt, minHours = 3) {
  return hoursUntil(lessonStart, noticeAt) >= minHours;
}

function isQrInsideWindow(lessonStart, scanAt, beforeMinutes = 30, afterMinutes = 90) {
  const start = new Date(lessonStart).getTime();
  const scan = new Date(scanAt).getTime();
  return scan >= start - beforeMinutes * 60_000 && scan <= start + afterMinutes * 60_000;
}

function packageStatus(pkg, now = new Date()) {
  if (pkg.status === 'CANCELLED') return 'CANCELLED';
  if (pkg.remainingRights <= 0) return 'COMPLETED';
  if (new Date(now).getTime() >= new Date(pkg.expiresAt).getTime()) return 'EXPIRED';
  return 'ACTIVE';
}

function canReplaceParticipant(pkg) {
  const limit = pkg.participantChangeLimit ?? 0;
  const used = pkg.participantChangesUsed ?? 0;
  const capacity = pkg.capacity ?? 1;
  const count = pkg.participantIds?.length ?? 0;
  return count < capacity && used < limit;
}

function lessonConsumesPackage(status) {
  return status === 'COMPLETED' || status === 'NO_SHOW';
}

function trainerEarns(status) {
  return status === 'COMPLETED' || status === 'NO_SHOW';
}

function hasScheduleOverlap(existingLessons, candidate, trainerId) {
  const s = new Date(candidate.startAt).getTime();
  const e = new Date(candidate.endAt).getTime();
  return existingLessons.some((l) => {
    if (l.trainerId !== trainerId) return false;
    if (['CANCELLED', 'CANCELLED_BY_TRAINER'].includes(l.status)) return false;
    const ls = new Date(l.startAt).getTime();
    const le = new Date(l.endAt).getTime();
    return s < le && e > ls;
  });
}

function applyAttendance({ lesson, pkg, clientId, scanAt, trainerId, settings }) {
  if (lesson.trainerId !== trainerId) throw new Error('TRAINER_NOT_ASSIGNED');
  if (!pkg.participantIds.includes(clientId)) throw new Error('CLIENT_NOT_IN_PACKAGE');
  if (packageStatus(pkg, scanAt) !== 'ACTIVE') throw new Error('PACKAGE_NOT_ACTIVE');
  if (!isQrInsideWindow(lesson.startAt, scanAt, settings.qrBeforeMinutes, settings.qrAfterMinutes)) {
    throw new Error('QR_OUTSIDE_TIME_WINDOW');
  }
  const already = lesson.attendance?.some((a) => a.clientId === clientId && a.status === 'PRESENT');
  if (already) return { lesson, pkg, packageChanged: false, duplicate: true };

  const attendance = [...(lesson.attendance || []), { clientId, status: 'PRESENT', scannedAt: scanAt }];
  const firstConsumptive = !(lesson.attendance || []).some((a) => a.status === 'PRESENT' || a.status === 'NO_SHOW');
  const nextLesson = { ...lesson, attendance, status: 'COMPLETED' };
  const nextPkg = firstConsumptive ? { ...pkg, remainingRights: Math.max(0, pkg.remainingRights - 1) } : pkg;
  return { lesson: nextLesson, pkg: nextPkg, packageChanged: firstConsumptive, duplicate: false };
}

function applyNoShow({ lesson, pkg, clientId }) {
  if (!pkg.participantIds.includes(clientId)) throw new Error('CLIENT_NOT_IN_PACKAGE');
  const existing = lesson.attendance || [];
  if (existing.some((a) => a.clientId === clientId)) return { lesson, pkg, packageChanged: false, duplicate: true };
  const firstConsumptive = !existing.some((a) => a.status === 'PRESENT' || a.status === 'NO_SHOW');
  const attendance = [...existing, { clientId, status: 'NO_SHOW' }];
  const presentCount = attendance.filter((a) => a.status === 'PRESENT').length;
  const noShowCount = attendance.filter((a) => a.status === 'NO_SHOW').length;
  let status = lesson.status;
  if (presentCount > 0) status = 'COMPLETED';
  else if (noShowCount === lesson.participantIds.length) status = 'NO_SHOW';
  else status = 'PLANNED';
  const nextPkg = firstConsumptive ? { ...pkg, remainingRights: Math.max(0, pkg.remainingRights - 1) } : pkg;
  return { lesson: { ...lesson, attendance, status }, pkg: nextPkg, packageChanged: firstConsumptive, duplicate: false };
}

function scopeByTenant(records, tenantId) {
  return records.filter((r) => r.tenantId === tenantId);
}

function cancelPackage(pkg, lessons, now = new Date()) {
  const nextPkg = { ...pkg, status: 'CANCELLED', cancelledAt: new Date(now).toISOString(), remainingRights: 0 };
  const nextLessons = lessons.map((l) => {
    if (l.packageId !== pkg.id) return l;
    if (new Date(l.startAt) <= new Date(now)) return l;
    if (['COMPLETED', 'NO_SHOW'].includes(l.status)) return l;
    return { ...l, status: 'CANCELLED' };
  });
  return { pkg: nextPkg, lessons: nextLessons };
}

function calculateTrainerMonthlyEarnings(lessons, trainerId, ratePerLesson) {
  const count = lessons.filter((l) => l.trainerId === trainerId && trainerEarns(l.status)).length;
  return { count, amount: count * ratePerLesson };
}

function client(id){return state.clients.find(x=>x.id===id)}
function trainer(id){return state.trainers.find(x=>x.id===id)}
function pkg(id){return state.packages.find(x=>x.id===id)}
function lesson(id){return state.lessons.find(x=>x.id===id)}
function myClient(){return client(state.currentUser.clientId)}
function myTrainer(){return trainer(state.currentUser.trainerId)}
function myPackages(){return state.packages.filter(p=>p.participantIds.includes(state.currentUser.clientId) && packageStatus(p)==='ACTIVE')}
function myLessons(){return state.lessons.filter(l=>l.participantIds.includes(state.currentUser.clientId)).sort((a,b)=>new Date(a.startAt)-new Date(b.startAt))}
function trainerLessons(){return state.lessons.filter(l=>l.trainerId===state.currentUser.trainerId).sort((a,b)=>new Date(a.startAt)-new Date(b.startAt))}

function statusLabel(s){return ({PLANNED:'Planlandı',COMPLETED:'Tamamlandı',NO_SHOW:'No-show',CANCELLED_WITH_NOTICE:'Önceden iptal',CANCELLED_BY_TRAINER:'Antrenör iptal',CANCELLED:'İptal',RESCHEDULE_PENDING:'Onay bekliyor',RESCHEDULED:'Değiştirildi'})[s]||s}

function trainerCalendar(){
  const ls=trainerLessons(); const today=ls.filter(l=>sameDay(l.startAt)); let content='';
  if(state.ui.calendarMode==='day') content=`<div class="card"><div class="cardTitle"><h2>Bugünkü program</h2><span class="status">${today.length} ders</span></div><div class="list">${today.map(l=>`<div class="listRow"><div class="lessonMain"><div class="avatar">${fmtTime(l.startAt)}</div><div><div class="listRowTitle">${l.participantIds.map(id=>client(id)?.name).join(', ')}</div><div class="listRowSub">${l.branch} · ${l.type}</div></div></div><div class="rowActions"><span class="status ${statusClass(l.status)}">${statusLabel(l.status)}</span><button class="iconBtn" data-action="trainer-lesson-detail" data-id="${l.id}">${icon('chevron')}</button></div></div>`).join('')}</div></div>`;
  else if(state.ui.calendarMode==='week') content=`<div class="calendarWeek">${Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i);const day=ls.filter(l=>sameDay(l.startAt,d));return `<div class="dayCol"><div class="dayHead">${fmtDate(d.toISOString(),{weekday:'short',day:'2-digit'})}</div>${day.map(l=>`<div class="event"><time>${fmtTime(l.startAt)}</time>${l.branch}<br>${client(l.participantIds[0])?.name||''}</div>`).join('')||'<div class="muted" style="font-size:.7rem">Boş</div>'}</div>`}).join('')}</div>`;
  else content=`<div class="card"><div class="cardTitle"><h2>Aylık özet</h2></div><div class="grid four">${metric('Toplam',ls.length,'Ders kaydı','calendar')}${metric('Tamamlanan',ls.filter(l=>l.status==='COMPLETED').length,'Ücrete dahil','check')}${metric('No-show',ls.filter(l=>l.status==='NO_SHOW').length,'Ücrete dahil','clock')}${metric('İptal',ls.filter(l=>l.status.startsWith('CANCEL')).length,'Ücrete dahil değil','x')}</div></div>`;
  return `${pageHead('Takvimim','Sadece kendi derslerin; aynı saate ikinci ders planlanamaz.',`<button class="btn primary" data-action="new-trainer-lesson">${icon('plus')} Ders planla</button>`)}${approvalCards('trainer')}${calendarControls()}${content}`;
}

  const remaining=ps.reduce((s,p)=>s+p.remainingRights,0); const week=ls.filter(l=>{const diff=(new Date(l.startAt)-new Date())/(86400000);return diff>=0&&diff<7}).length;

function mockQr(seed='roar'){
  let hash=0; for(const ch of seed) hash=(hash*31+ch.charCodeAt(0))>>>0;
  const n=21, cells=[]; const rnd=()=>{hash=(1664525*hash+1013904223)>>>0;return hash/4294967296};
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const finder=(x<7&&y<7)||(x>=14&&y<7)||(x<7&&y>=14);
    let on=rnd()>.52;
    if(finder){const lx=x>=14?x-14:x, ly=y>=14?y-14:y; on=(lx===0||lx===6||ly===0||ly===6||(lx>=2&&lx<=4&&ly>=2&&ly<=4));}
    if(on) cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
  }
  return `<svg viewBox="0 0 ${n} ${n}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/><g fill="#071006">${cells.join('')}</g></svg>`;
}

function markPaid(paymentId,installmentId){
  const p=state.payments.find(x=>x.id===paymentId);const i=p?.installments.find(x=>x.id===installmentId);if(!p||!i)return;
  if(i.status!=='PAID'){i.status='PAID';p.paid+=i.amount;p.status=p.paid>=p.total?'PAID':'PARTIAL';audit('PAYMENT_MARKED_PAID','PAYMENT',p.id,`${money(i.amount)} tahsil edildi olarak işaretlendi.`);toast('Ödeme tahsil edildi olarak kaydedildi.');render()}
}
function doCancelPackage(id){
  const p=pkg(id);if(!p)return;
  if(!confirm(`${p.name} iptal edilsin mi? Kalan haklar kapanacak ve gelecek dersler iptal olacak.`))return;
  const result=cancelPackage(p,state.lessons,new Date());state.packages=state.packages.map(x=>x.id===id?result.pkg:x);state.lessons=result.lessons;audit('PACKAGE_CANCELLED','PACKAGE',id,'Paket iptal edildi; kalan haklar ve gelecek dersler kapatıldı.');toast('Paket iptal edildi.');closeModal();render();
}
function removeParticipant(packageId,clientId){
  const p=pkg(packageId);if(!p||p.capacity<=1)return;
  if(p.participantIds.length<=1){toast('Paket en az bir katılımcıyla kalmalı.','danger');return}
  p.participantIds=p.participantIds.filter(id=>id!==clientId);p.participantChangesUsed=Math.min(p.participantChangeLimit,(p.participantChangesUsed||0)+1);audit('PACKAGE_PARTICIPANT_REMOVED','PACKAGE',p.id,`${client(clientId)?.name||clientId} ortak paketten ayrıldı.`);toast('Katılımcı paketten ayrıldı.');packageDetailModal(p.id);renderPage();
}
function scanClient(lessonId,clientId){
  const l=lesson(lessonId);const p=pkg(l.packageId);const trId=state.currentUser.trainerId; if(!l||!p)return;
  const scanAt=new Date(new Date(l.startAt).getTime()+5*60_000).toISOString();
  try{
    const result=applyAttendance({lesson:l,pkg:p,clientId,scanAt,trainerId:trId,settings:state.settings});
    state.lessons=state.lessons.map(x=>x.id===l.id?result.lesson:x);state.packages=state.packages.map(x=>x.id===p.id?result.pkg:x);
    if(result.duplicate) toast('Bu danışanın katılımı zaten kayıtlı.');
    else {audit('QR_ATTENDANCE_RECORDED','LESSON',l.id,`${client(clientId)?.name} QR ile katıldı.${result.packageChanged?' Paket hakkı 1 düştü.':' Ek paket hakkı düşmedi.'}`);toast(result.packageChanged?'Ders tamamlandı, paketten 1 hak düştü.':'Katılım kaydedildi; paket hakkı tekrar düşmedi.');}
    scannerModal(l.id);renderPage();
  }catch(e){toast(({'TRAINER_NOT_ASSIGNED':'Bu ders başka antrenöre ait.','CLIENT_NOT_IN_PACKAGE':'Danışan bu pakette değil.','PACKAGE_NOT_ACTIVE':'Paket aktif değil.','QR_OUTSIDE_TIME_WINDOW':'QR geçerli ders zaman aralığında değil.'})[e.message]||e.message,'danger')}
}
function markNoShow(id){
  const l=lesson(id);const p=pkg(l.packageId);if(!l||!p)return;
  if(l.status!=='PLANNED'){toast('Ders planlı durumda değil.','danger');return}
  l.status='NO_SHOW';l.attendance=l.participantIds.map(cid=>({clientId:cid,status:'NO_SHOW'}));p.remainingRights=Math.max(0,p.remainingRights-1);audit('LESSON_NO_SHOW','LESSON',l.id,'Danışan bildirmeden gelmedi; paketten 1 hak düştü ve antrenör ücretine dahil edildi.');toast('No-show kaydedildi: paket -1, antrenör ücreti dahil.');closeModal();render();
}
function trainerCancel(id){const l=lesson(id);if(!l)return;l.status='CANCELLED_BY_TRAINER';audit('LESSON_CANCELLED_BY_TRAINER','LESSON',l.id,'Antrenör dersi iptal etti; hak ve ücret düşmedi.');toast('Ders antrenör tarafından iptal edildi; paket ve ücret etkilenmedi.');closeModal();render()}
function rollbackLesson(id){
  const l=lesson(id);const p=pkg(l.packageId);if(!l||!p||!['COMPLETED','NO_SHOW'].includes(l.status))return;
  const prev=l.status;l.status='PLANNED';l.attendance=[];p.remainingRights=Math.min(p.lessonCount,p.remainingRights+1);audit('LESSON_ROLLED_BACK','LESSON',l.id,`${prev} kaydı geri alındı; paket hakkı 1 iade edildi ve antrenör kazancı yeniden hesaplandı.`);toast('Ders geri alındı; hak ve kazanç rollback edildi.');closeModal();render();
}

  if(action==='delete-request'){if(confirm('Hesap silme talebi oluşturulsun mu? Yasal saklama gerektiren kayıtlar retention politikasına tabi kalır.')){audit('ACCOUNT_DELETE_REQUESTED','USER',state.role==='client'?state.currentUser.clientId:state.currentUser.trainerId,'Hesap silme talebi oluşturuldu.');toast('Hesap silme talebi oluşturuldu.')}return}
  if(action==='logout-all'){toast('Demo: tüm aktif oturumlar sonlandırıldı.');audit('LOGOUT_ALL_SESSIONS','SECURITY','session','Tüm cihazlardan çıkış tetiklendi.');return}
  if(action==='reset-demo'){if(confirm('Demo verileri sıfırlansın mı?')){state=seedState();persist();render();toast('Demo verisi sıfırlandı.')}return}
  if(action==='cycle-theme'){state.settings.theme=state.settings.theme==='dark'?'light':state.settings.theme==='light'?'system':'dark';render();return}
  if(action==='toggle-language'){state.settings.language=state.settings.language==='TR'?'EN':'TR';render();return}
  if(action==='toast-demo'){toast('Kampanya kartı danışan salon ekranında yayınlanır.');return}
  if(action==='open-map'){toast('Harita yönlendirmesi üretimde cihaz harita uygulamasını açar.');return}
  if(action==='apply-client-search'){state.ui.clientSearch=document.getElementById('clientSearch')?.value||'';renderPage();return}
  if(action==='apply-trainer-search'){state.ui.trainerSearch=document.getElementById('trainerSearch')?.value||'';renderPage();return}
  const routes={
    'go-packages':'packages','go-payments':'payments','go-announcements':'announcements','go-audit':'audit',
    'go-scan':'scan','go-trainer-clients':'clients','go-earnings':'earnings','go-trainer-calendar':'calendar',
    'go-client-qr':'qr','go-client-calendar':'calendar','go-client-progress':'progress','go-client-profile':'profile'
  };
  if(routes[action]){go(routes[action]);return}
  if(action==='go-earnings'){go('earnings');return}
}

function handleSubmit(form){
  const fd=new FormData(form);const obj=Object.fromEntries(fd.entries());
  if(form.id==='newClientForm'){
    const c={id:uid('c'),tenantId:state.tenant.id,name:obj.name,phone:obj.phone,email:obj.email,status:'ACTIVE',trainerIds:[obj.trainerId],joinedAt:new Date().toISOString(),branch:obj.branch};state.clients.unshift(c);audit('CLIENT_CREATED','CLIENT',c.id,`${c.name} oluşturuldu.`);closeModal();toast('Danışan eklendi.');render();return;
  }
  if(form.id==='newTrainerForm'){
    const tr={id:uid('t'),tenantId:state.tenant.id,name:obj.name,phone:obj.phone,specialty:obj.specialty,ratePerLesson:Number(obj.rate),payDay:Number(obj.payDay),status:'ACTIVE'};state.trainers.unshift(tr);audit('TRAINER_CREATED','TRAINER',tr.id,`${tr.name} oluşturuldu.`);closeModal();toast('Antrenör eklendi.');render();return;
  }
  if(form.id==='newPackageForm'){
    const p={id:uid('pt'),tenantId:state.tenant.id,name:obj.name,branch:obj.branch,lessonType:obj.lessonType,lessonCount:Number(obj.lessonCount),capacity:Number(obj.capacity),price:Number(obj.price),participantChangeLimit:Number(obj.changeLimit),active:true};state.templates.unshift(p);audit('PACKAGE_TEMPLATE_CREATED','PACKAGE_TEMPLATE',p.id,`${p.name} oluşturuldu.`);closeModal();toast('Paket şablonu oluşturuldu.');render();return;
  }
  if(form.id==='newSaleForm'){
    const tpl=state.templates.find(x=>x.id===obj.templateId);if(!tpl)return;const firstPayment=Number(obj.firstPayment);if(firstPayment<=0){toast('Aktivasyon için en az ilk tahsilat kaydı gerekli.','danger');return}
    const act=new Date().toISOString();const p={id:uid('p'),tenantId:state.tenant.id,templateId:tpl.id,name:tpl.name,branch:tpl.branch,lessonType:tpl.lessonType,lessonCount:tpl.lessonCount,remainingRights:tpl.lessonCount,capacity:tpl.capacity,participantIds:[obj.clientId],participantChangeLimit:tpl.participantChangeLimit,participantChangesUsed:0,trainerId:obj.trainerId,activatedAt:act,expiresAt:addYear(act),salePrice:Number(obj.salePrice),status:'ACTIVE'};state.packages.unshift(p);
    const pay={id:uid('pay'),tenantId:state.tenant.id,packageId:p.id,clientId:obj.clientId,total:Number(obj.salePrice),paid:firstPayment,status:firstPayment>=Number(obj.salePrice)?'PAID':'PARTIAL',installments:[{id:uid('ins'),date:act,amount:firstPayment,status:'PAID'}]};state.payments.unshift(pay);audit('PACKAGE_SOLD','PACKAGE',p.id,`${client(obj.clientId)?.name} için ${p.name} aktive edildi.`);closeModal();toast('Paket satışı ve ilk tahsilat kaydedildi.');render();return;
  }
  if(form.id==='newLessonForm'){
    const p=pkg(obj.packageId);const day=Number(obj.dayOffset),hour=Number(obj.hour);const start=isoAt(day,hour),end=isoAt(day,hour+1);const candidate={startAt:start,endAt:end};if(hasScheduleOverlap(state.lessons,candidate,obj.trainerId)){toast('Antrenörün bu saat aralığında başka dersi var.','danger');return}
    const l={id:uid('l'),tenantId:state.tenant.id,packageId:p.id,trainerId:obj.trainerId,participantIds:[...p.participantIds],branch:p.branch,type:p.lessonType==='GROUP'?'Grup':p.lessonType==='DUO'?'İkili':'Birebir',startAt:start,endAt:end,status:'PLANNED',attendance:[]};state.lessons.push(l);audit('LESSON_PLANNED','LESSON',l.id,`${p.name} için ders planlandı.`);closeModal();toast('Ders takvime eklendi.');render();return;
  }
  if(form.id==='newAnnouncementForm'){
    const roles=obj.role==='both'?['client','trainer']:[obj.role];const a={id:uid('a'),title:obj.title,body:obj.body,active:true,roles,createdAt:new Date().toISOString()};state.announcements.unshift(a);audit('ANNOUNCEMENT_PUBLISHED','ANNOUNCEMENT',a.id,a.title);closeModal();toast('Duyuru yayınlandı.');render();return;
  }
  if(form.id==='assignTrainerForm'){
    const c=client(obj.clientId);const old=[...c.trainerIds];if(!c.trainerIds.includes(obj.trainerId))c.trainerIds.push(obj.trainerId);state.lessons.filter(l=>l.participantIds.includes(c.id)&&new Date(l.startAt)>new Date()&&l.branch===obj.branch&&l.status==='PLANNED').forEach(l=>l.trainerId=obj.trainerId);audit('TRAINER_ASSIGNED','CLIENT',c.id,`${obj.branch} için ${trainer(obj.trainerId)?.name} atandı; gelecek dersler güncellendi. Önceki: ${old.map(id=>trainer(id)?.name).join(', ')}`);closeModal();toast('Antrenör ataması güncellendi.');render();return;
  }
  if(form.id==='addParticipantForm'){
    const p=pkg(obj.packageId);if(!canReplaceParticipant(p)){toast('Paket kapasitesi veya değişiklik limiti uygun değil.','danger');return}p.participantIds.push(obj.clientId);p.participantChangesUsed=(p.participantChangesUsed||0)+1;audit('PACKAGE_PARTICIPANT_ADDED','PACKAGE',p.id,`${client(obj.clientId)?.name} ortak pakete eklendi.`);closeModal();toast('Katılımcı pakete eklendi.');render();return;
  }
  if(form.id==='newPaymentPlanForm'){
    const total=Number(obj.total),count=Math.max(1,Number(obj.count));const each=Math.round(total/count);const installments=Array.from({length:count},(_,i)=>({id:uid('ins'),date:isoAt(i*30,9),amount:i===count-1?total-each*(count-1):each,status:i===0?'PAID':'PENDING'}));const paid=installments[0].amount;const p={id:uid('pay'),tenantId:state.tenant.id,packageId:obj.packageId,clientId:obj.clientId,total,paid,status:paid>=total?'PAID':'PARTIAL',installments};state.payments.unshift(p);audit('PAYMENT_PLAN_CREATED','PAYMENT',p.id,`${count} taksitli ödeme planı oluşturuldu.`);closeModal();toast('Ödeme planı oluşturuldu.');render();return;
  }
  if(form.id==='trainerLessonForm'){
    const p=pkg(obj.packageId);const trId=state.currentUser.trainerId;if(!p||p.trainerId!==trId){toast('Yalnızca sana atanmış paketler için ders planlayabilirsin.','danger');return}
    const day=Number(obj.dayOffset),hour=Number(obj.hour);const start=isoAt(day,hour),end=isoAt(day,hour+1);if(hasScheduleOverlap(state.lessons,{startAt:start,endAt:end},trId)){toast('Bu zaman aralığında başka dersin var.','danger');return}
    const l={id:uid('l'),tenantId:state.tenant.id,packageId:p.id,trainerId:trId,participantIds:[...p.participantIds],branch:p.branch,type:p.lessonType==='GROUP'?'Grup':p.lessonType==='DUO'?'İkili':'Birebir',startAt:start,endAt:end,status:'PLANNED',attendance:[]};state.lessons.push(l);audit('TRAINER_LESSON_PLANNED','LESSON',l.id,`${myTrainer().name} kendi takvimine ders ekledi.`);closeModal();toast('Ders kendi takvimine eklendi.');render();return;
  }
  if(form.id==='measurementForm'){
    const m={id:uid('m'),tenantId:state.tenant.id,clientId:obj.clientId,trainerId:state.currentUser.trainerId,date:new Date().toISOString(),weight:Number(obj.weight),waist:Number(obj.waist),hip:Number(obj.hip),bodyFat:Number(obj.bodyFat)};state.measurements.push(m);audit('MEASUREMENT_ADDED','MEASUREMENT',m.id,`${client(obj.clientId)?.name} için yeni ölçüm kaydedildi.`);closeModal();toast('Ölçüm tarihsel kayda eklendi.');render();return;
  }
  if(form.id==='rescheduleForm'){
    const l=lesson(obj.lessonId);const start=isoAt(Number(obj.dayOffset),Number(obj.hour));const end=isoAt(Number(obj.dayOffset),Number(obj.hour)+1);l.rescheduleRequest={initiator:obj.initiator,newStartAt:start,newEndAt:end,status:'PENDING'};l.status='RESCHEDULE_PENDING';audit('RESCHEDULE_REQUESTED','LESSON',l.id,`${obj.initiator} tarafından ${fmtDate(start,{day:'2-digit',month:'short'})} ${fmtTime(start)} önerildi.`);closeModal();toast('Değişiklik talebi oluşturuldu; mevcut saat onaya kadar korunur.');render();return;
  }
}

document.addEventListener('click',(e)=>{
  const nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}
  const role=e.target.closest('[data-role]');if(role){switchRole(role.dataset.role);return}
  const cal=e.target.closest('[data-cal]');if(cal){state.ui.calendarMode=cal.dataset.cal;renderPage();return}
  const cf=e.target.closest('[data-client-filter]');if(cf){state.ui.clientFilter=cf.dataset.clientFilter;renderPage();return}
  const pf=e.target.closest('[data-package-filter]');if(pf){state.ui.packageFilter=pf.dataset.packageFilter;renderPage();return}
  const tog=e.target.closest('[data-toggle-setting]');if(tog){const k=tog.dataset.toggleSetting;state.settings[k]=!state.settings[k];render();return}
  const nt=e.target.closest('[data-toggle-notification]');if(nt){const k=nt.dataset.toggleNotification;state.settings.notifications[k]=!state.settings.notifications[k];persist();if(document.getElementById('modalBackdrop').classList.contains('open'))notificationSettingsModal();else render();return}
  const act=e.target.closest('[data-action]');if(act){handleAction(act.dataset.action,act);return}
  if(!e.target.closest('#roleSheet')&&!e.target.closest('[data-action="role-menu"]'))document.getElementById('roleSheet').classList.remove('open');
});
document.addEventListener('submit',(e)=>{e.preventDefault();handleSubmit(e.target)});
document.addEventListener('change',(e)=>{
  if(e.target.id==='themeSelect'){state.settings.theme=e.target.value;render()}
  if(e.target.id==='languageSelect'){state.settings.language=e.target.value;render()}
});
document.addEventListener('keydown',(e)=>{if(e.key==='Escape'){closeModal();document.getElementById('roleSheet').classList.remove('open')}});
window.addEventListener('online',updateOnline);window.addEventListener('offline',updateOnline);
if(location.protocol.startsWith('http') && 'serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
updateOnline();render();

function trainerLessonPlanModal(){
  const trId=state.currentUser.trainerId;
  const ps=state.packages.filter(p=>packageStatus(p)==='ACTIVE'&&p.trainerId===trId);
  openModal('Kendi dersini planla',`<form id="trainerLessonForm" class="fields"><div class="field"><label>Paket / danışan</label><select name="packageId">${ps.map(p=>`<option value="${p.id}">${p.name} · ${p.participantIds.map(id=>client(id)?.name).join(', ')}</option>`).join('')}</select></div><div class="grid two"><div class="field"><label>Gün</label><select name="dayOffset"><option value="0">Bugün</option><option value="1">Yarın</option><option value="2">+2 gün</option><option value="3">+3 gün</option></select></div><div class="field"><label>Saat</label><input name="hour" type="number" min="6" max="22" value="18"></div></div><div class="notice"><div>${icon('calendar')}</div><div><b>Çakışma kontrolü</b><div class="muted">Antrenör aynı zaman aralığında başka bir derse atanamaz.</div></div></div><div class="modalActions"><button type="button" class="btn" data-action="close-modal">Vazgeç</button><button class="btn primary">Planla</button></div></form>`)
}
function scanNoShow(lessonId,clientId){
  const l=lesson(lessonId),p=pkg(l?.packageId);if(!l||!p)return;
  try{
    const result=applyNoShow({lesson:l,pkg:p,clientId});
    state.lessons=state.lessons.map(x=>x.id===l.id?result.lesson:x);state.packages=state.packages.map(x=>x.id===p.id?result.pkg:x);
    if(result.duplicate) toast('Bu katılımcı için durum zaten kayıtlı.');
    else {audit('PARTICIPANT_NO_SHOW','LESSON',l.id,`${client(clientId)?.name} no-show kaydedildi.${result.packageChanged?' Ortak paketten 1 hak düştü.':' Ek paket hakkı düşmedi.'}`);toast(result.packageChanged?'No-show kaydedildi; dersten toplam 1 hak tüketildi.':'No-show kaydedildi; ekstra hak düşmedi.');}
    scannerModal(l.id);renderPage();
  }catch(e){toast(e.message,'danger')}
}
function clientCancelLesson(id){
  const l=lesson(id),p=pkg(l?.packageId),cid=state.currentUser.clientId;if(!l||!p)return;
  if(l.status!=='PLANNED'){toast('Bu ders artık iptal edilemez.','danger');return}
  const safe=canCancelWithoutCharge(l.startAt,new Date(),state.settings.cancellationHours);
  if(!confirm(safe?`Dersi iptal etmek istediğine emin misin? En az ${state.settings.cancellationHours} saat önce bildirdiğin için paket hakkın korunacak.`:`Derse ${state.settings.cancellationHours} saatten az kaldı. İptal no-show gibi değerlendirilecek ve paket hakkı düşecek. Devam edilsin mi?`))return;
  if(safe){
    if(l.participantIds.length===1){l.status='CANCELLED_WITH_NOTICE';}
    l.attendance=[...(l.attendance||[]).filter(a=>a.clientId!==cid),{clientId:cid,status:'CANCELLED_WITH_NOTICE',notifiedAt:new Date().toISOString()}];
    const cancelledCount=l.attendance.filter(a=>a.status==='CANCELLED_WITH_NOTICE').length;
    if(cancelledCount===l.participantIds.length)l.status='CANCELLED_WITH_NOTICE';
    audit('LESSON_CANCELLED_WITH_NOTICE','LESSON',l.id,`${client(cid)?.name} en az ${state.settings.cancellationHours} saat önce bildirdi; hak düşmedi.`);toast('İptal bildirimi kaydedildi; paket hakkı korundu.');
  }else{
    const result=applyNoShow({lesson:l,pkg:p,clientId:cid});state.lessons=state.lessons.map(x=>x.id===l.id?result.lesson:x);state.packages=state.packages.map(x=>x.id===p.id?result.pkg:x);audit('LATE_CANCEL_NO_SHOW','LESSON',l.id,`${client(cid)?.name} geç bildirdi; no-show olarak işlendi.${result.packageChanged?' Paket -1.':''}`);toast('Geç iptal no-show olarak kaydedildi; paket hakkı tüketildi.');
  }
  closeModal();render();
}
function approvalCards(role){
  const pending=state.lessons.filter(l=>l.status==='RESCHEDULE_PENDING'&&l.rescheduleRequest?.status==='PENDING'&&((role==='trainer'&&l.trainerId===state.currentUser.trainerId&&l.rescheduleRequest.initiator==='client')||(role==='client'&&l.participantIds.includes(state.currentUser.clientId)&&l.rescheduleRequest.initiator==='trainer')));
  if(!pending.length)return '';
  return `<div class="card highlight" style="margin-bottom:14px"><div class="cardTitle"><h2>Onay bekleyen değişiklik</h2><span class="status warn">${pending.length}</span></div>${pending.map(l=>`<div class="listRow"><div><div class="listRowTitle">${l.branch} · ${client(l.participantIds[0])?.name||''}</div><div class="listRowSub">${fmtDate(l.startAt,{day:'2-digit',month:'short'})} ${fmtTime(l.startAt)} → ${fmtDate(l.rescheduleRequest.newStartAt,{day:'2-digit',month:'short'})} ${fmtTime(l.rescheduleRequest.newStartAt)}</div></div><div class="rowActions"><button class="btn small" data-action="reject-reschedule" data-id="${l.id}">Reddet</button><button class="btn small primary" data-action="approve-reschedule" data-id="${l.id}">Onayla</button></div></div>`).join('')}</div>`;
}
function approveReschedule(id){
  const l=lesson(id);if(!l?.rescheduleRequest)return;const r=l.rescheduleRequest;
  if(hasScheduleOverlap(state.lessons.filter(x=>x.id!==l.id),{startAt:r.newStartAt,endAt:r.newEndAt},l.trainerId)){toast('Önerilen saatte antrenörün başka dersi var.','danger');return}
  const old=`${l.startAt}`;l.startAt=r.newStartAt;l.endAt=r.newEndAt;l.status='PLANNED';r.status='APPROVED';l.rescheduleHistory=[...(l.rescheduleHistory||[]),{oldStartAt:old,newStartAt:l.startAt,approvedAt:new Date().toISOString()}];audit('RESCHEDULE_APPROVED','LESSON',l.id,`Ders değişikliği onaylandı: ${fmtDate(l.startAt,{day:'2-digit',month:'short'})} ${fmtTime(l.startAt)}.`);toast('Yeni ders saati onaylandı.');render();
}
function rejectReschedule(id){const l=lesson(id);if(!l?.rescheduleRequest)return;l.rescheduleRequest.status='REJECTED';l.status='PLANNED';audit('RESCHEDULE_REJECTED','LESSON',l.id,'Değişiklik talebi reddedildi; mevcut ders korundu.');toast('Talep reddedildi; mevcut takvim değişmedi.');render()}

</script>
